<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Source of media/icon.png. Regenerate: see README "Icon". Paths only, no fonts. -->
  <rect width="256" height="256" rx="56" fill="#111827"/>
  <!-- subtle rim so the tile separates from dark UI backgrounds -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- magnifier -->
  <line x1="172" y1="172" x2="226" y2="226" stroke="#F97316" stroke-width="30" stroke-linecap="round"/>
  <circle cx="114" cy="114" r="78" fill="none" stroke="#F97316" stroke-width="18"/>

  <!-- Markdown mark "M" + down arrow inside the lens -->
  <g transform="translate(114 116) scale(0.82) translate(-101 -102)" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="48,130 48,76 76,108 104,76 104,130"/>
    <line x1="144" y1="76" x2="144" y2="130"/>
    <polyline points="128,114 144,130 160,114"/>
